[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "leaf modules stay pure (score/cookie_reader 无内部依赖)"
type = "independence"
modules = ["src.score", "src.cookie_reader"]

[[tool.importlinter.contracts]]
name = "server is top layer (任何模块不得依赖 server，防循环)"
type = "forbidden"
source_modules = ["src"]
forbidden_modules = ["src.server"]
