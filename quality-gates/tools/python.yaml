# 工具映射表 — Python（codex-zhuke 裁剪版）
# 运行约定：仓库根执行 bash <skill>/tooling/bin/quality-check.sh --stage commit
# <GAUNTLET_DIR> = skill 仓库根；vendor 真实目录=<GAUNTLET_DIR>/tooling/vendor
# （R-6.53z1 修正：2026-11-05 起 vendor 改为技能目录内真实目录；此前是指向
#  /private/tmp/gauntlet/vendor 的 symlink，/tmp 被系统清理后 7 个工具集体缺失。vendor 不进本仓库。）

language: python

crap_tool: crapper
crap_cmd: export CRAPPER_BIN=<GAUNTLET_DIR>/tooling/vendor/crapper/crapper && <GAUNTLET_DIR>/tooling/vendor/crapper/crapper -s backend/src --no-coverage && bash quality-gates/tools/check_cc.sh

mutation_tool: mutator
mutation_cmd: <GAUNTLET_DIR>/tooling/vendor/mutator/mutator -s backend/src

coverage_tool: coverage.py
coverage_install: backend/.venv/bin/python（已装 pytest+coverage）
coverage_cmd: (cd backend && ../backend/.venv/bin/python -m coverage run -m pytest -q && ../backend/.venv/bin/python -m coverage report --fail-under=60)

architecture_tool: import-linter
architecture_install: backend/.venv 已装 importlinter
architecture_config: backend/pyproject.toml  # [tool.importlinter]
architecture_cmd: (cd backend && ../backend/.venv/bin/lint-imports)

dry_tool: dryer
dry_cmd: <GAUNTLET_DIR>/tooling/vendor/dryer/dryer --edn backend/src

# TS 侧现状（2026-11-03 基线）：frontend package.json 仅 dev/build/preview，
# 无 vitest/test/coverage 脚本 → TS 覆盖率维度 N/A（见基线报告）；
# TS 源码 CC 可由 crapper -s frontend/src 扫描（本映射未挂 commit 门，待 TS 测试基建落地）。
