# Quality Gates — codex-zhuke 质量关卡（commit/merge 阈值声明）
# 模板出处：clean-code-gauntlet skill templates/project/quality-gates/gates.yaml
# 本文件只声明"查什么+阈值"；工具命令见 tools/python.yaml。
# R-6.36e 用户拍板：核心模块集收窄为 server/engine_pool/collect_pipeline；
# 覆盖率阈值按可达值定，未达标项登记豁免理由（不放松 CC/CRAP 逐函数硬门槛）。

维度:
  复杂度_CRAP:
    when: commit
    圈复杂度: { 阈值: "≤8", 说明: "逐函数硬门槛，由 tools/check_cc.sh 执行（R-6.53z2 起，此前无工具执行）；存量超标登记 cc-baseline.txt，只许减不许增，拆空即全量硬拦；人类标准 ≤4" }
    CRAP分:  { 阈值: "<30", 说明: "≥30 高风险：重构或补测试" }
  覆盖率:
    when: commit
    行覆盖:
      核心模块:
        模块: [server, engine_pool, collect_pipeline]
        阈值: "R-6.37g 实测：server 79% / engine_pool 45% / collect_pipeline 以实测为准"
      非核心登记:
        模块: [shell_window, mirror, browser_client]
        阈值: "可达值阈值：shell_window 60%（R-6.74 实测，此前 19%）/ mirror 82% /
          browser_client 27%；不低于本实测值即放行"
        豁免理由: "重度 GUI/Playwright 运行时依赖，剩余 40% 集中在 ensure_shell、
          _guard_monitor_loop、_keeper_rebuild_shell、keep_shell_tab 等长事件循环路径，
          单测不可达；由 scripts/ui_tests t12/t13/t14 在真实浏览器上守护行为"
      其余模块: { 阈值: "≥60%", 说明: "config/logger/score/risk/license/injections/intent/jsonio/llm_service" }
  变异测试:
    when: optional
    存活变异体: { 阈值: "=0", 说明: "等价变异体人工登记后豁免（EQUIVALENT-MUTANTS.md）" }
    不适用理由: "R-6.75 实测（2026-11-08）：全项目 1579 个变异站点，单轮全量测试
      19.2s → 单轮变异约 8.8 小时（单机）。本项目历史 bug 绝大多数是行为回归
      （采集链路、窗口状态、登录态），由 scripts/ui_tests t01-t14 在真实浏览器上
      守护；分支级变异的边际收益低于成本，故不进 CI。需要时本地按改动范围收窄：
      <GAUNTLET>/tooling/vendor/mutator/mutator -s backend/src --changed"
  架构依赖:
    when: merge
    依赖违规: { 阈值: "=0", 说明: "契约见 backend/pyproject.toml [tool.importlinter]" }
    循环依赖: { 阈值: "=0", 说明: "engine_pool↔shell_window 函数级懒导入为现状" }

可选维度:
  DRY重复代码:
    when: optional
    说明: "dryer --threshold 0.82；quality-check.sh --with-dry（merge 阶段）"
